# RemoteCI fnOS Docker 应用编排。
# 由飞牛 fnOS 应用中心管理：安装/升级后应用中心会拉取镜像并重建容器。
# 镜像标签中的版本占位符在打包时被替换为具体版本号（见 fnos/build.sh）。
services:
  remoteci:
    image: ghcr.io/memz-edge01/remoteci:__REMOTECI_VERSION__
    container_name: remoteci
    restart: unless-stopped
    networks:
      - trim-default
    ports:
      # 向导字段 remoteci_web_port 由 fnOS 以同名环境变量注入，缺省使用 manifest.service_port。
      - "${remoteci_web_port:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      # 标记 fnOS 运行环境，WebUI 系统更新面板只显示由应用商店管理。
      REMOTECI_RUNTIME: fnos
      REMOTECI_ADMIN_PASSWORD: "${remoteci_admin_password:-}"
      REMOTECI_PLUGIN_PAIR_CODE: "${remoteci_plugin_pair_code:-}"
      # SQLite 数据库固定写入容器内 /app/data，并由 fnOS 数据卷持久化。
      Server__DatabasePath: /app/data/remoteci.db
    volumes:
      - "${TRIM_PKGVAR}/data:/app/data"

networks:
  trim-default:
    external: true
