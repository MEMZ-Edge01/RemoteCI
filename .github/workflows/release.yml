name: Release

# 推送 v* 标签时构建四端产物并发布 GitHub Release。
# 产物：服务端压缩包、插件 CIPX、手表 APK、飞牛 fnOS 应用（.fpk）与 GHCR 多架构镜像。
# 手表 APK 使用仓库 Secrets 中的签名密钥（ANDROID_KEYSTORE_B64 等）。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-server:
    name: 服务端 (linux-x64 / win-x64)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, win-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish 服务端压缩包
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish server/RemoteCI.Server/RemoteCI.Server.csproj -c Release -r ${{ matrix.rid }} \
            --self-contained false -o "publish/${{ matrix.rid }}"
          cd "publish/${{ matrix.rid }}"
          zip -r "../RemoteCI.Server-${version}-${{ matrix.rid }}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.rid }}
          path: publish/RemoteCI.Server-*-${{ matrix.rid }}.zip

  build-plugin:
    name: 插件 CIPX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: 打包 CIPX
        run: |
          dotnet build plugin/RemoteCI.Plugin/RemoteCI.Plugin.csproj -c Release -p:CreateCipx=true
          version="${GITHUB_REF_NAME#v}"
          cp plugin/RemoteCI.Plugin/cipx/RemoteCI.Plugin.cipx "RemoteCI.Plugin-${version}.cipx"
          cp plugin/RemoteCI.Plugin/cipx/checksums.md "RemoteCI.Plugin-${version}.checksums.md"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-cipx
          path: |
            RemoteCI.Plugin-*.cipx
            RemoteCI.Plugin-*.checksums.md

  build-wearos:
    name: 手表 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 配置签名密钥
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::warning::未配置签名密钥，将构建未签名 APK"
            exit 0
          fi
          mkdir -p wearos/keystore
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > wearos/keystore/remoteci-release.jks
          {
            echo "storeFile=keystore/remoteci-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > wearos/keystore.properties
      - name: 构建 Release APK
        working-directory: wearos
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --console=plain
      - name: 按版本重命名 APK
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp wearos/app/build/outputs/apk/release/app-release.apk "RemoteCI.Watch-${version}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: watch-apk
          path: RemoteCI.Watch-*.apk

  build-fnos:
    name: fnOS 应用 (镜像 + fpk)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 提取版本号
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/RemoteCI.Server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/memz-edge01/remoteci:${{ steps.meta.outputs.version }}
            ghcr.io/memz-edge01/remoteci:latest
      - name: 确保 GHCR 镜像包公开
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 首次推送后镜像包默认为私有，fnOS 拉取需要公开可见；
          # 若令牌无权修改可见性会失败，可在仓库 Settings -> Packages 中手动设为 Public。
          gh api --method PATCH /user/packages/container/remoteci -f visibility=public || true
      - name: 下载 fnpack 并打包 fpk
        run: |
          mkdir -p .tools
          curl -fsSL -o .tools/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x .tools/fnpack
          REMOTECI_VERSION="${{ steps.meta.outputs.version }}" bash fnos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fnos-fpk
          path: artifacts/release/RemoteCI-*.fpk

  release:
    name: 创建 GitHub Release
    needs: [build-server, build-plugin, build-wearos, build-fnos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
